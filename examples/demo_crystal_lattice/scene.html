<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IntuiSim Demo - Diamond Cubic Silicon Lattice Disassembly</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #080c14; font-family: 'Inter', -apple-system, sans-serif; }
    #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .hud-card {
      position: absolute;
      top: 48px;
      left: 64px;
      padding: 24px 32px;
      background: rgba(8, 12, 20, 0.75);
      border: 1px solid rgba(0, 240, 255, 0.25);
      border-radius: 12px;
      backdrop-filter: blur(16px);
      color: #e2e8f0;
      pointer-events: none;
      z-index: 10;
    }
    .hud-card h1 { font-size: 24px; font-weight: 600; color: #00f0ff; letter-spacing: 0.05em; margin-bottom: 6px; }
    .hud-card p { font-size: 14px; color: #94a3b8; font-family: monospace; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div class="hud-card">
    <h1>DIAMOND CUBIC SILICON LATTICE</h1>
    <p>Fd3m Space Group &nbsp;|&nbsp; a = 5.43 &Aring; &nbsp;|&nbsp; Octant Disassembly</p>
  </div>

  <script type="module">
    import * as THREE from '../../assets/vendor/three.module.js';
    import { DiamondCubicUnitCell } from '../../assets/structures/DiamondCubicUnitCell.js';

    const container = document.getElementById('canvas-container');
    const width = window.innerWidth;
    const height = window.innerHeight;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x080c14);

    const camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 1000);
    camera.position.set(12, 9, 14);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(window.devicePixelRatio || 1);
    container.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0x00f0ff, 2.5);
    dirLight1.position.set(15, 25, 20);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xffa500, 1.8);
    dirLight2.position.set(-20, -10, -15);
    scene.add(dirLight2);

    const grid = new THREE.GridHelper(20, 20, 0x00f0ff, 0x1e293b);
    grid.position.y = -3.5;
    scene.add(grid);

    const cell = new DiamondCubicUnitCell({
      a: 5.43,
      atomRadius: 0.48,
      bondRadius: 0.07,
      initialExplosion: 0.0,
      clippedOctants: false
    });
    scene.add(cell);

    function stepFrame(t) {
      const angle = t * 0.45;
      const radius = 18.0;
      camera.position.x = Math.sin(angle) * radius;
      camera.position.z = Math.cos(angle) * radius;
      camera.position.y = 8.0 + Math.sin(t * 0.5) * 2.0;
      camera.lookAt(0, 0, 0);

      // Smooth pulsing explosion disassembly
      const explosion = 0.5 - 0.5 * Math.cos(t * 1.05);
      cell.setExplosion(explosion * 0.65);

      renderer.render(scene, camera);
    }

    window.renderFrame = stepFrame;
    window.__RENDER_FRAME = stepFrame;
    window.__SCENE_READY = true;
    window.__SCENE_READY__ = true;

    stepFrame(0.0);

    let startTime = performance.now();
    function animate() {
      requestAnimationFrame(animate);
      const elapsed = (performance.now() - startTime) / 1000;
      stepFrame(elapsed);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
