<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IntuiSim Demo - Quantum Harmonic Oscillator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #081120; font-family: 'Inter', -apple-system, sans-serif; }
    #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .hud-card {
      position: absolute;
      top: 48px;
      left: 64px;
      padding: 24px 32px;
      background: rgba(8, 17, 32, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      backdrop-filter: blur(16px);
      color: #e2e8f0;
      pointer-events: none;
      z-index: 10;
    }
    .hud-card h1 { font-size: 24px; font-weight: 600; color: #00f0ff; letter-spacing: 0.05em; margin-bottom: 6px; }
    .hud-card p { font-size: 14px; color: #94a3b8; font-family: monospace; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div class="hud-card">
    <h1>1D HARMONIC OSCILLATOR</h1>
    <p>V(x) = &frac12; m &omega;&sup2; x&sup2; &nbsp;|&nbsp; &psi;(x, t) Coherent State</p>
  </div>

  <script type="module">
    import * as THREE from '../../assets/vendor/three.module.js';
    import { WavepacketField } from '../../engine/primitives/WavepacketField.js';

    const container = document.getElementById('canvas-container');
    const width = window.innerWidth;
    const height = window.innerHeight;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x081120);

    const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
    camera.position.set(0, 8, 22);
    camera.lookAt(0, 1.5, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(window.devicePixelRatio || 1);
    container.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0x00f0ff, 2.5);
    dirLight.position.set(10, 20, 15);
    scene.add(dirLight);

    const keyLight = new THREE.PointLight(0xffd000, 3.0, 50);
    keyLight.position.set(-10, 8, 5);
    scene.add(keyLight);

    const potPoints = [];
    for (let x = -10; x <= 10; x += 0.25) {
      const y = 0.045 * (x * x);
      potPoints.push(new THREE.Vector3(x, y, 0));
    }
    const potGeom = new THREE.BufferGeometry().setFromPoints(potPoints);
    const potMat = new THREE.LineBasicMaterial({ color: 0xffd000, linewidth: 2, transparent: true, opacity: 0.8 });
    const potLine = new THREE.Line(potGeom, potMat);
    scene.add(potLine);

    const grid = new THREE.GridHelper(24, 24, 0x1e293b, 0x0f172a);
    grid.position.y = -0.05;
    scene.add(grid);

    const waveField = new WavepacketField({
      xMin: -11,
      xMax: 11,
      numSamples: 260,
      barrierWidth: 0.2,
      barrierHeight: 0.1,
      x0: -5.0,
      sigma0: 1.1,
      k0: 2.2
    });
    scene.add(waveField.group);

    function stepFrame(t) {
      const omega = 1.25;
      const xCenter = -5.0 * Math.cos(omega * t);
      waveField.x0 = xCenter;
      waveField.step(t);
      camera.position.x = Math.sin(t * 0.15) * 2.0;
      camera.lookAt(0, 1.5, 0);
      renderer.render(scene, camera);
    }

    window.renderFrame = stepFrame;
    window.__RENDER_FRAME = stepFrame;
    window.__SCENE_READY = true;
    window.__SCENE_READY__ = true;

    stepFrame(0.0);

    let startTime = performance.now();
    function animate() {
      requestAnimationFrame(animate);
      const elapsed = (performance.now() - startTime) / 1000;
      stepFrame(elapsed);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
